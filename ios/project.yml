name: Flow
options:
  bundleIdPrefix: app.civitai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  FlowCore:
    path: FlowCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flow:
    type: application
    platform: iOS
    sources:
      - path: Flow
    dependencies:
      - package: FlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.civitai.flow.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Flow/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Flow:
    build:
      targets:
        Flow: all
    run:
      config: Debug
    archive:
      config: Release
